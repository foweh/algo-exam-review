<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 算法设计与分析 · 期末复习系统</title>
<script src="题库加载器.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; color: #333; min-height: 100vh;
}

.navbar {
  background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
  color: #fff; padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); position: sticky; top: 0; z-index: 100;
}
.navbar h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.navbar .stats { font-size: 13px; opacity: .9; }
.navbar .stats span { margin-left: 12px; }
.loading-bar { height: 3px; background: #ffd700; transition: width .4s; width: 0%; }

.mode-bar {
  display: flex; background: #fff; border-bottom: 1px solid #e0e0e0;
  position: sticky; top: 56px; z-index: 99;
  align-items: center;
}
.mode-tab {
  text-align: center; padding: 12px 8px; cursor: pointer;
  font-size: 15px; font-weight: 500; color: #666; border-bottom: 3px solid transparent;
  transition: all .2s; user-select: none;
}
.mode-tab:hover { background: #f7f9fc; }
.mode-tab.active { color: #1a3a5c; border-bottom-color: #2d6a9f; background: #f0f6ff; }

.search-box {
  display: flex; align-items: center; margin-left: auto; padding: 0 12px;
}
.search-box input {
  padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px;
  font-size: 13px; width: 180px; outline: none;
}
.search-box input:focus { border-color: #2d6a9f; }
.search-box button {
  padding: 6px 12px; background: #2d6a9f; color: #fff;
  border: none; border-radius: 6px; margin-left: 6px; cursor: pointer;
}
.search-box button:hover { background: #1a4a7a; }

.stats-bar {
  display: flex; justify-content: center; gap: 24px; padding: 12px;
  background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
  border-radius: 10px; margin-bottom: 16px;
}
.stats-item {
  text-align: center;
}
.stats-item .value {
  font-size: 24px; font-weight: 700; color: #0369a1;
}
.stats-item .label {
  font-size: 12px; color: #64748b;
}
.stats-item.correct .value { color: #16a34a; }
.stats-item.wrong .value { color: #dc2626; }

.knowledge-card {
  background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08); border-left: 4px solid #2d6a9f;
}
.knowledge-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.knowledge-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
.knowledge-title {
  font-size: 18px; font-weight: 600; color: #1e293b;
}
.knowledge-category {
  padding: 4px 12px; background: #e0e7ff; color: #4338ca;
  border-radius: 12px; font-size: 12px;
}
.knowledge-content {
  font-size: 14px; line-height: 1.8; color: #334155;
  white-space: pre-wrap; word-break: break-all;
}
.knowledge-content strong { color: #1e293b; }
.knowledge-content code {
  background: #f1f5f9; padding: 2px 6px; border-radius: 4px;
  font-family: monospace; font-size: 13px;
}
.knowledge-empty {
  text-align: center; padding: 40px; color: #999;
}

.container { max-width: 820px; margin: 0 auto; padding: 16px; }
.panel { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.hidden { display: none !important; }

.type-tabs {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
}
.type-tab {
  padding: 6px 16px; border-radius: 20px; background: #f0f2f5;
  cursor: pointer; font-size: 14px; border: 1px solid transparent;
  transition: all .2s; user-select: none;
}
.type-tab:hover { background: #e4e7eb; }
.type-tab.active { background: #2d6a9f; color: #fff; border-color: #2d6a9f; }
.type-tab .count { font-size: 12px; opacity: .7; margin-left: 4px; }

.timer-box {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
  background: #fff3cd; border-radius: 8px; margin-bottom: 16px;
  font-size: 16px; font-weight: 600; color: #856404;
}
.timer-box.warning { background: #fef08a; color: #a16207; }
.timer-box.danger { background: #fee2e2; color: #dc2626; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

.question-area { min-height: 200px; }
.q-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 13px; color: #888;
}
.q-header .q-progress { font-weight: 600; color: #333; font-size: 15px; }
.q-title { font-size: 16px; line-height: 1.6; margin-bottom: 14px; font-weight: 500; }
.q-code {
  background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 16px;
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 13px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap;
  margin-bottom: 14px;
}
.q-desc { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.5; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
  cursor: pointer; transition: all .2s; font-size: 15px;
}
.option:hover:not(.disabled) { border-color: #2d6a9f; background: #f7faff; }
.option.selected { border-color: #2d6a9f; background: #e8f0fe; }
.option .letter {
  width: 28px; height: 28px; border-radius: 50%; background: #f0f2f5;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .letter { background: #2d6a9f; color: #fff; }
.option.correct { border-color: #16a34a; background: #f0fdf4; }
.option.correct .letter { background: #16a34a; color: #fff; }
.option.wrong { border-color: #dc2626; background: #fef2f2; }
.option.wrong .letter { background: #dc2626; color: #fff; }
.option.disabled { cursor: default; opacity: .8; }

.explanation-box {
    margin-top: 14px; padding: 14px; border-radius: 10px;
    background: #f0f9ff; border: 1px solid #bae6fd;
    font-size: 14px; line-height: 1.8; color: #0369a1;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .explanation-box .label { font-weight: 600; margin-bottom: 8px; display: block; font-size: 15px; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn {
  padding: 8px 20px; border: none; border-radius: 8px; font-size: 14px;
  cursor: pointer; transition: all .2s; font-weight: 500;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: #2d6a9f; color: #fff; }
.btn-primary:hover { background: #1a4a7a; }
.btn-success { background: #16a34a; color: #fff; }
.btn-success:hover { background: #15803d; }
.btn-outline { background: #fff; color: #333; border: 1px solid #ddd; }
.btn-outline:hover { background: #f7f9fc; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.wrong-item {
  padding: 14px 16px; border-left: 4px solid #dc2626; background: #fef2f2;
  border-radius: 8px; margin-bottom: 12px;
}
.wrong-item .q-header { margin-bottom: 8px; }
.wrong-item .q-text { font-weight: 500; margin-bottom: 8px; font-size: 15px; }
.wrong-item .detail { font-size: 13px; color: #888; margin-bottom: 8px; }
.wrong-item .detail .your { color: #dc2626; }
.wrong-item .detail .correct-ans { color: #16a34a; }
.wrong-item .error-count {
  display: inline-block; padding: 2px 10px; background: #dc2626; color: #fff;
  border-radius: 12px; font-size: 12px; font-weight: 600;
}
.wrong-empty { text-align: center; color: #999; padding: 40px 0; font-size: 15px; }
.action-row { display: flex; gap: 8px; margin-top: 12px; }

.result-panel {
  text-align: center; padding: 30px;
}
.result-panel .score {
  font-size: 48px; font-weight: 700; margin-bottom: 10px;
}
.result-panel .score.pass { color: #16a34a; }
.result-panel .score.fail { color: #dc2626; }
.result-panel .stats { font-size: 14px; color: #666; margin-bottom: 20px; }
.result-panel .stats span { margin: 0 12px; }

.question-grid {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  max-height: 200px; overflow-y: auto;
  padding: 10px;
  background: #f8fafc;
  border-radius: 10px;
}
.question-num {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  border: 2px solid;
}
.question-num.correct {
  background: #dcfce7; color: #166534; border-color: #22c55e;
}
.question-num.wrong {
  background: #fee2e2; color: #991b1b; border-color: #ef4444;
}
.question-num:hover {
  transform: scale(1.1);
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.detail-panel {
  margin-top: 20px; padding: 20px;
  background: #f8fafc; border-radius: 12px;
  text-align: left;
}
.detail-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;
}
.detail-title {
  font-size: 18px; font-weight: 600; color: #1e293b;
}
.detail-type {
  padding: 4px 12px; background: #e0e7ff; color: #4338ca;
  border-radius: 12px; font-size: 12px;
}
.detail-close {
  margin-left: auto; padding: 6px 10px;
  background: #fff; border: 1px solid #e2e8f0;
  border-radius: 6px; cursor: pointer;
  font-size: 14px; color: #64748b;
}
.detail-close:hover { background: #f1f5f9; }
.detail-question {
  font-size: 16px; line-height: 1.6; margin-bottom: 16px;
  font-weight: 500; color: #1e293b;
}
.options-list {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;
}
.option-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 8px;
  border: 2px solid #e2e8f0;
  background: #fff;
}
.option-letter {
  width: 26px; height: 26px; border-radius: 50%;
  background: #f1f5f9; color: #64748b;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 12px;
  flex-shrink: 0;
}
.option-text { font-size: 14px; color: #334155; }
.detail-answers {
  display: flex; gap: 24px; margin-bottom: 16px;
  flex-wrap: wrap;
}
.answer-item {
  font-size: 14px;
}
.answer-item .label { color: #64748b; margin-right: 8px; }
.answer-item .value { font-weight: 600; }
.answer-item .value.correct { color: #16a34a; }
.answer-item .value.wrong { color: #dc2626; }
.detail-explanation {
  padding: 14px; background: #f0f9ff; border-radius: 8px;
  border: 1px solid #bae6fd;
}
.detail-explanation .label {
  font-weight: 600; color: #0369a1; margin-bottom: 8px;
  display: block; font-size: 15px;
}
.detail-explanation .content {
  font-size: 14px; line-height: 1.8; color: #075985;
  white-space: pre-wrap;
  word-break: break-all;
}

.placeholder {
  text-align: center; color: #999; padding: 60px 20px;
}
.placeholder .icon { font-size: 48px; margin-bottom: 12px; }
.placeholder p { font-size: 15px; line-height: 1.6; }

@media (max-width: 600px) {
  .navbar h1 { font-size: 15px; }
  .navbar .stats { font-size: 11px; }
  .q-title { font-size: 15px; }
}
</style>
</head>
<body>

<div class="navbar">
  <h1>📚 算法设计与分析 · 期末复习</h1>
</div>
<div class="loading-bar" id="loadingBar"></div>

<div class="mode-bar">
  <div class="mode-tab active" data-mode="practice" onclick="switchMode('practice')">✏️ 练题模式</div>
  <div class="mode-tab" data-mode="exam" onclick="switchMode('exam')">📝 考试模式</div>
  <div class="mode-tab" data-mode="knowledge" onclick="switchMode('knowledge')">📚 知识点</div>
  <div class="mode-tab" data-mode="examfocus" onclick="switchMode('examfocus')">🚨 考前速记</div>
  <div class="mode-tab" data-mode="wrongbook" onclick="switchMode('wrongbook')">📕 错题本 (<span id="wrongTabCount">0</span>)</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索知识点..." onkeyup="handleSearch(event)">
    <button onclick="performSearch()">🔍</button>
  </div>
</div>

<div id="statsBarContainer"></div>
<div class="container">
  <div id="mode-practice">
    <div class="type-tabs" id="practiceTypeTabs"></div>
    <div class="panel" id="practiceSettings">
      <button class="btn btn-primary" onclick="startPractice()">🚀 开始练题</button>
    </div>
    <div class="panel hidden" id="practicePanel">
      <div class="q-header">
        <span class="q-progress" id="practiceProgress"></span>
        <span id="practiceTypeLabel" style="background:#eef2ff;padding:2px 10px;border-radius:12px;font-size:13px;color:#4f46e5"></span>
      </div>
      <div class="question-area" id="practiceQuestionArea"></div>
    </div>
    <div class="placeholder" id="practiceEmpty">
      <div class="icon">📭</div>
      <p>题库加载中……</p>
    </div>
  </div>

  <div id="mode-exam" class="hidden">
    <div class="panel">
      <h2 style="font-size:18px;margin-bottom:12px">📝 考试模式</h2>
      <p style="font-size:14px;color:#666;margin-bottom:16px">考试规则：随机抽取50道选择题，限时30分钟。考试结束后自动评分，错题将记录到错题本。</p>
      <div class="timer-box" id="examTimer">⏱️ 准备开始</div>
      <button class="btn btn-primary" onclick="startExam()">🎯 开始考试</button>
    </div>
    <div class="panel hidden" id="examPanel">
      <div class="q-header">
        <span class="q-progress" id="examProgress"></span>
      </div>
      <div class="question-area" id="examQuestionArea"></div>
    </div>
    <div class="panel hidden" id="examResult"></div>
  </div>

  <div id="mode-wrongbook" class="hidden">
    <div class="panel">
      <h2 style="font-size:18px;margin-bottom:4px">📕 错题本 <span id="wrongTitleCount" style="font-size:13px;color:#888"></span></h2>
      <p style="font-size:13px;color:#999;margin-bottom:12px">答错的题目自动收录在这里，按错误次数排序</p>
      <div id="wrongList"><div class="wrong-empty">✨ 暂无错题，继续加油！</div></div>
      <div class="action-row" id="wrongActions" style="display:none">
        <button class="btn btn-primary" onclick="replayWrong()">🔄 重做错题</button>
        <button class="btn btn-danger" onclick="clearWrongBook()">🗑️ 清空错题本</button>
      </div>
    </div>
  </div>

  <div id="mode-knowledge" class="hidden">
    <div class="panel">
      <h2 style="font-size:18px;margin-bottom:12px">📚 知识点讲解</h2>
      <p style="font-size:13px;color:#999;margin-bottom:16px">系统整理算法设计与分析的核心知识点，帮助理解记忆</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="filter-btn active" onclick="filterKnowledge('全部')">全部</button>
        <button class="filter-btn" onclick="filterKnowledge('基础概念')">基础概念</button>
        <button class="filter-btn" onclick="filterKnowledge('复杂度分析')">复杂度分析</button>
        <button class="filter-btn" onclick="filterKnowledge('算法策略')">算法策略</button>
        <button class="filter-btn" onclick="filterKnowledge('计算复杂性')">计算复杂性</button>
        <button class="filter-btn" onclick="filterKnowledge('排序算法')">排序算法</button>
        <button class="filter-btn" onclick="filterKnowledge('图算法')">图算法</button>
        <button class="filter-btn" onclick="filterKnowledge('考前速记')">考前速记</button>
      </div>
      <div id="knowledgeList"></div>
    </div>
  </div>

  <div id="mode-examfocus" class="hidden">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="font-size:18px">🚨 考前速记</h2>
        <span style="font-size:13px;color:#f59e0b;background:#fffbeb;padding:4px 12px;border-radius:12px">考试前必看！</span>
      </div>
      <p style="font-size:13px;color:#999;margin-bottom:16px">精选高频考点，快速回顾核心知识，助你高效备考！</p>
      <div id="examFocusList"></div>
    </div>
  </div>
</div>

<script>
(function() {
  let currentQuestions = [];
  let currentIndex = 0;
  let currentAnswers = {};
  let currentAnswered = false;
  let examMode = false;
  let examAnswers = {};
  let examStartTime = 0;
  let examTimer = null;
  let examTimeLimit = 60 * 60;

  let wrongBook = JSON.parse(localStorage.getItem('algoWrongBook_v3') || '[]');
  let scoreData = JSON.parse(localStorage.getItem('algoScoreData_v3') || '{}');
  let totalStats = JSON.parse(localStorage.getItem('algoTotalStats_v3') || '{"total":0,"correct":0,"wrong":0}');

  const $ = function(id) { return document.getElementById(id); };

  var selectedType = null;

  function saveTotalStats() {
    localStorage.setItem('algoTotalStats_v3', JSON.stringify(totalStats));
  }

  function updateStatsBar() {
    var total = totalStats.total || 0;
    var correct = totalStats.correct || 0;
    var wrong = totalStats.wrong || 0;
    var rate = total > 0 ? Math.round((correct / total) * 100) : 0;
    
    var encouragement = '';
    if (total === 0) {
      encouragement = '开始做题吧！';
    } else if (rate >= 90) {
      encouragement = '太棒了！你是学霸！🎉';
    } else if (rate >= 80) {
      encouragement = '非常优秀！继续保持！🌟';
    } else if (rate >= 70) {
      encouragement = '表现不错！加油！💪';
    } else if (rate >= 60) {
      encouragement = '及格了，还需努力！📚';
    } else if (rate >= 50) {
      encouragement = '还需加油，多练习！✏️';
    } else {
      encouragement = '别灰心，坚持就是胜利！🔥';
    }

    var statsHtml = '<div class="stats-bar">'
                  + '<div class="stats-item"><div class="value">' + total + '</div><div class="label">总做题数</div></div>'
                  + '<div class="stats-item correct"><div class="value">' + correct + '</div><div class="label">正确次数</div></div>'
                  + '<div class="stats-item wrong"><div class="value">' + wrong + '</div><div class="label">错误次数</div></div>'
                  + '<div class="stats-item"><div class="value">' + rate + '%</div><div class="label">正确率</div></div>'
                  + '<div class="stats-item" style="flex:2"><div class="value" style="font-size:16px">' + encouragement + '</div></div>'
                  + '</div>';
    
    $('statsBarContainer').innerHTML = statsHtml;
  }

  window.onQuestionsLoaded = function(bank) {
    $('loadingBar').style.width = '100%';
    setTimeout(function() { $('loadingBar').style.width = '0%'; }, 600);
    renderTypeTabs();
    updateNavStats();
    updateStatsBar();
    renderWrongBook();
    renderKnowledgePoints();
    var types = window.题库.getTypes();
    if (types.length > 0) {
      selectType(types[0]);
      $('practiceEmpty').classList.add('hidden');
    } else {
      $('practiceEmpty').querySelector('p').textContent = '❌ 未找到任何题目，请检查 questions/ 目录。';
    }
  };

  if (window.题库 && window.题库._raw && Object.keys(window.题库._raw).length > 0) {
    window.onQuestionsLoaded(window.题库._raw);
  }

  function renderTypeTabs() {
    var types = window.题库.getTypes();
    $('practiceTypeTabs').innerHTML = types.map(function(t) {
      var count = window.题库.getTypeCount(t);
      return '<div class="type-tab" data-type="' + t + '" onclick="selectType(\'' + t + '\')">'
           + t + ' <span class="count">(' + count + ')</span></div>';
    }).join('');
  }

  window.selectType = function(type) {
    selectedType = type;
    $('practiceTypeTabs').querySelectorAll('.type-tab').forEach(function(el) {
      el.classList.toggle('active', el.dataset.type === type);
    });
    $('practicePanel').classList.add('hidden');
    $('practiceSettings').classList.remove('hidden');
  };

  window.switchMode = function(mode) {
    document.querySelectorAll('.mode-tab').forEach(function(el) {
      el.classList.toggle('active', el.dataset.mode === mode);
    });
    ['practice', 'exam', 'wrongbook', 'knowledge', 'examfocus'].forEach(function(name) {
      var el = document.getElementById('mode-' + name);
      if (el) el.classList.toggle('hidden', name !== mode);
    });
    if (mode === 'wrongbook') renderWrongBook();
    if (mode === 'knowledge') renderKnowledgePoints();
    if (mode === 'examfocus') renderExamFocusPoints();
    if (mode === 'examfocus' && typeof renderExamFocusPointsFromFile !== 'undefined') renderExamFocusPointsFromFile();
    if (mode === 'exam' && examTimer) {

  function getExplanation(q) {
    var externalExplanations = (window.题库 && window.题库._explanations) || {};
    
    if (q.explanation) return escapeHtml(q.explanation);
    
    if (q.answer && q.options && q.options.length > 0) {
      var answerIndex = q.answer.charCodeAt(0) - 65;
      if (answerIndex >= 0 && answerIndex < q.options.length) {
        var answerText = q.options[answerIndex];
        if (externalExplanations[answerText]) {
          return externalExplanations[answerText];
        }
      }
    }
    
    return '【题目解析 · 算法策略速查参考】\n\n本题未收录独立解析，以下为该科目核心算法体系的速查总表，可直接对应本题知识点。\n\n' +
      '━━━ 一、五大算法设计策略 ━━━\n\n' +
      '① 分治法\n' +
      '  ▸ 核心思想：大问题→独立子问题→递归解决→合并结果\n' +
      '  ▸ 适用条件：子问题相互独立，解可合并\n' +
      '  ▸ 典型应用：归并排序、快速排序、二分查找、棋盘覆盖、Strassen矩阵乘法\n' +
      '  ▸ 复杂度：通常 O(n log n)\n\n' +
      '② 动态规划法\n' +
      '  ▸ 核心思想：重叠子问题 → 表格记录避免重复计算\n' +
      '  ▸ 两大要素：最优子结构 + 重叠子问题\n' +
      '  ▸ 实现方式：自底向上（迭代）或自顶向下（递归+备忘录）\n' +
      '  ▸ 典型应用：LCS、矩阵连乘、0/1背包、最大子段和(Kadane)\n' +
      '  ▸ 复杂度：取决于状态数和转移代价\n\n' +
      '③ 贪心法\n' +
      '  ▸ 核心思想：每步选当前最优，期望全局最优（不回溯）\n' +
      '  ▸ 两大要素：贪心选择性质 + 最优子结构\n' +
      '  ▸ 与DP区别：DP全局考量，贪心局部决策，贪心仅当选择性质成立时才正确\n' +
      '  ▸ 典型应用：活动安排(选最早结束)、Huffman编码、Dijkstra、Prim/Kruskal\n' +
      '  ▸ 注意：0/1背包不能用贪心（但分数背包可以）\n\n' +
      '④ 回溯法\n' +
      '  ▸ 核心思想：DFS解空间树 + 剪枝，走不通就回头\n' +
      '  ▸ 解空间树：子集树（选/不选，2^n）和排列树（排列，n!）\n' +
      '  ▸ 剪枝函数：约束函数（可行性）+ 限界函数（最优性）\n' +
      '  ▸ 典型应用：N皇后、TSP、图的着色、子集和\n\n' +
      '⑤ 分支限界法\n' +
      '  ▸ 核心思想：BFS/优先队列搜索 + 上下界剪枝\n' +
      '  ▸ 搜索方式：广度优先(FIFO)、最小耗费优先(最小堆)、最大效益优先(最大堆)\n' +
      '  ▸ 与回溯区别：回溯DFS求所有解/可行解，分支限界BFS求最优解\n' +
      '  ▸ 典型应用：TSP(最小堆)、0/1背包(最大堆)\n\n' +
      '━━━ 二、概率（随机化）算法 ━━━\n\n' +
      '  ▸ 蒙特卡罗：总是出答案但可能错（近似正确），可多次运行降误差\n' +
      '  ▸ 拉斯维加斯：答案总是正确但可能失败（不成功便成仁）\n' +
      '  ▸ 舍伍德：总是正确且不失败，消除最坏情况（如随机快排选基准）\n' +
      '  ▸ 数值概率：近似计算数值问题（如蒙特卡罗积分）\n\n' +
      '━━━ 三、复杂度分析 ━━━\n\n' +
      '  效率排序：O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ) < O(n!)\n' +
      '  ▸ 递归空间复杂度看递归深度（栈帧数）\n' +
      '  ▸ 算法分析主要关注最坏情况（上界）\n' +
      '  ▸ P类：多项式时间可解；NP类：多项式时间可验证\n\n' +
      '━━━ 四、常见问题对应算法速查 ━━━\n\n' +
      '  棋盘覆盖 → 分治    |  合并排序 → 分治    |  循环赛日程表 → 分治\n' +
      '  矩阵连乘 → DP       |  LCS → DP           |  最大子段和 → DP\n' +
      '  0/1背包 → DP/回溯/分支限界（贪心不可用）\n' +
      '  活动安排 → 贪心     |  最优装载 → 贪心    |  Huffman编码 → 贪心\n' +
      '  N皇后 → 回溯        |  TSP → 回溯/分支限界\n\n' +
      '（提示：本总表覆盖绝大多数选择题/填空题考点。如需具体题目的逐题解析，可在 questions/explanations.js 中查看或补充。）';
  }

  window.startExam = function() {
    var pool = [];
    var types = window.题库.getTypes();
    types.forEach(function(type) {
      var questions = window.题库.getQuestions(type);
      questions.forEach(function(q) {
        if (Array.isArray(q.options) && q.options.length > 0) {
          pool.push({...q, originalType: type});
        }
      });
    });

    if (pool.length === 0) {
      alert('题库中没有选择题');
      return;
    }

    if (pool.length < 100) {
      alert('题库中只有 ' + pool.length + ' 道选择题，无法出100道题');
      return;
    }

    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }

    currentQuestions = pool.slice(0, 100);
    currentIndex = 0;

    examMode = true;
    examStartTime = Date.now();

    $('examTimer').classList.remove('warning', 'danger');

    examTimer = setInterval(updateExamTimer, 1000);

    document.querySelector('#mode-exam .panel:first-child').classList.add('hidden');
    $('examResult').classList.add('hidden');
    $('examPanel').classList.remove('hidden');

  function updateExamTimer() {
    var elapsed = Math.floor((Date.now() - examStartTime) / 1000);
    var remaining = examTimeLimit - elapsed;
    
    if (remaining <= 0) {
      clearInterval(examTimer);
      finishExam();
      return;
    }

    var minutes = Math.floor(remaining / 60);
    var seconds = remaining % 60;
    var display = '⏱️ ' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    
    var timerBox = $('examTimer');
    timerBox.textContent = display;
    
    if (remaining <= 60) {
      timerBox.classList.add('danger');
      timerBox.classList.remove('warning');
    } else if (remaining <= 300) {
      timerBox.classList.add('warning');
    }
  }

  function finishExam() {
    clearInterval(examTimer);
    $('examTimer').textContent = '⏱️ 考试结束';

    var correctCount = 0;
    var wrongList = [];
    var examResults = [];

    currentQuestions.forEach(function(q, index) {
      var userAnswer = examAnswers[q.id] || '';
      var correct = userAnswer === q.answer;
      examResults.push({
        index: index + 1,
        q: q,
        userAnswer: userAnswer,
        correct: correct
      });
      if (correct) {
        correctCount++;
      } else {
        wrongList.push({ q: q, userAnswer: userAnswer });
        addToWrongBook(q, userAnswer);
      }
      recordScore(q.originalType || '选择题', correct);
    });

    var score = Math.round((correctCount / currentQuestions.length) * 100);
    var pass = score >= 60;

    var questionButtons = '';
    examResults.forEach(function(result) {
      var cls = result.correct ? 'correct' : 'wrong';
      questionButtons += '<span class="question-num ' + cls + '" onclick="showExamQuestionDetail(' + (result.index - 1) + ')">' + result.index + '</span>';
    });

    var html = '<div class="result-panel">'
             + '<div class="icon" style="font-size:64px;margin-bottom:16px">' + (pass ? '🎉' : '💪') + '</div>'
             + '<div class="score ' + (pass ? 'pass' : 'fail') + '">' + score + '分</div>'
             + '<div class="stats">'
             + '<span>📝 总题数：' + currentQuestions.length + '</span>'
             + '<span>✅ 正确：' + correctCount + '</span>'
             + '<span>❌ 错误：' + (currentQuestions.length - correctCount) + '</span>'
             + '</div>'
             + '<div style="margin-top:24px;">'
             + '<div style="font-size:14px;color:#666;margin-bottom:12px;">📊 答题情况（点击题号查看详情）</div>'
             + '<div class="question-grid">' + questionButtons + '</div>'
             + '</div>'
             + '<div id="examQuestionDetail" class="detail-panel hidden"></div>'
             + '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
             + '<button class="btn btn-primary" onclick="resetExam()">🔄 再考一次</button>'
             + '<button class="btn btn-outline" onclick="switchMode(\'wrongbook\')">📕 查看错题</button>'
             + '<button class="btn btn-outline" onclick="switchMode(\'practice\')">✏️ 返回练题</button>'
             + '</div>'
             + '</div>';

    $('examPanel').classList.add('hidden');
    $('examResult').innerHTML = html;
    $('examResult').classList.remove('hidden');
    updateNavStats();

  function addToWrongBook(q, userAnswer) {
    var existingIndex = wrongBook.findIndex(function(w) { return w.id === q.id; });
    if (existingIndex >= 0) {
      wrongBook[existingIndex].count = (wrongBook[existingIndex].count || 1) + 1;
      wrongBook[existingIndex].lastTime = new Date().toLocaleString();
      wrongBook[existingIndex].userAnswer = userAnswer;
    } else {
      wrongBook.push({
        id: q.id,
        type: q.originalType || selectedType || '选择题',
        question: q.question,
        options: q.options || null,
        answer: q.answer,
        userAnswer: userAnswer,
        code: q.code || null,
        title: q.title || null,
        description: q.description || null,
        count: 1,
        correctCount: 0,
        lastTime: new Date().toLocaleString()
      });
    }
    wrongBook.sort(function(a, b) { return (b.count || 1) - (a.count || 1); });
    saveWrongBook();
  }

  function addCorrectCount(q) {
    var existingIndex = wrongBook.findIndex(function(w) { return w.id === q.id; });
    if (existingIndex >= 0) {
      wrongBook[existingIndex].correctCount = (wrongBook[existingIndex].correctCount || 0) + 1;
      wrongBook[existingIndex].lastCorrectTime = new Date().toLocaleString();
      
      var wrongCount = wrongBook[existingIndex].count || 1;
      var correctCount = wrongBook[existingIndex].correctCount;
      
      if (correctCount > wrongCount) {
        showPraise(q);
        wrongBook.splice(existingIndex, 1);
      }
      
      saveWrongBook();
      renderWrongBook();
    }
  }

  }

  function showWrongBookDetail(id) {
    var w = wrongBook.find(function(item) { return item.id === id; });
    if (!w) return;

    var existingPanel = document.getElementById('wrongDetailPanel');
    if (existingPanel) {
      document.body.removeChild(existingPanel);
    }

    var fullQ = window.题库.getQuestions(w.type).find(function(q) { return q.id === w.id; }) || w;

    var letters = ['A','B','C','D','E','F'];
    var optHtml = '';
    if (Array.isArray(w.options) && w.options.length > 0) {
      optHtml = '<div class="options-list">';
      w.options.forEach(function(o, i) {
        var l = letters[i];
        var style = '';
        if (l === w.answer) {
          style = 'background:#dcfce7;color:#166534;border-color:#22c55e';
        } else if (l === w.userAnswer) {
          style = 'background:#fee2e2;color:#991b1b;border-color:#ef4444';
        }
        optHtml += '<div class="option-item" style="' + style + '">'
                 + '<span class="option-letter">' + l + '</span>'
                 + '<span class="option-text">' + escapeHtml(o) + '</span>'
                 + '</div>';
      });
      optHtml += '</div>';
    }

    var detailHtml = '<div class="detail-header">'
                   + '<span class="detail-title">📕 错题详情</span>'
                   + '<span class="detail-type">' + w.type + '</span>'
                   + '<button class="detail-close" onclick="closeWrongDetail()">✕</button>'
                   + '</div>'
                   + '<div class="q-header" style="margin-bottom:16px;">'
                   + '<span class="error-count">错误 ' + (w.count || 1) + ' 次</span>'
                   + (w.correctCount > 0 ? '<span style="background:#dcfce7;padding:2px 8px;border-radius:10px;font-size:12px;color:#166534;margin-left:8px">答对 ' + w.correctCount + ' 次</span>' : '')
                   + '</div>'
                   + '<div class="detail-question">' + escapeHtml(w.question) + '</div>'
                   + optHtml
                   + '<div class="detail-answers">'
                   + '<span class="answer-item">'
                   + '<span class="label">你的答案：</span>'
                   + '<span class="value wrong">' + (w.userAnswer || '未作答') + '</span>'
                   + '</span>'
                   + '<span class="answer-item">'
                   + '<span class="label">正确答案：</span>'
                   + '<span class="value correct">' + w.answer + '</span>'
                   + '</span>'
                   + '</div>'
                   + '<div class="detail-explanation">'
                   + '<span class="label">💡 解析</span>'
                   + '<div class="content">' + getExplanation(fullQ) + '</div>'
                   + '</div>';

    var panel = document.createElement('div');
    panel.id = 'wrongDetailPanel';
    panel.className = 'detail-panel';
    panel.innerHTML = detailHtml;
    document.body.appendChild(panel);
  }

  function closeWrongDetail() {
    var panel = document.getElementById('wrongDetailPanel');
    if (panel) {
      document.body.removeChild(panel);
    }
  }

  function renderWrongBook() {
    var list = $('wrongList');
    var actions = $('wrongActions');
    
    if (wrongBook.length === 0) {
      list.innerHTML = '<div class="wrong-empty">✨ 暂无错题，继续加油！</div>';
      actions.style.display = 'none';
      $('wrongTitleCount').textContent = '';
      return;
    }

    actions.style.display = 'flex';
    $('wrongTitleCount').textContent = '（共 ' + wrongBook.length + ' 题，按错误次数排序）';

    var letters = ['A','B','C','D','E','F'];
    list.innerHTML = wrongBook.map(function(w) {
      var hasOpt = Array.isArray(w.options) && w.options.length > 0;
      var optHtml = '';
      if (hasOpt) {
        optHtml = '<div style="margin-top:6px;font-size:13px">';
        w.options.forEach(function(o, i) {
          var l = letters[i];
          var cls = l === w.answer ? 'correct-ans' : (l === w.userAnswer ? 'your' : '');
          optHtml += '<span style="margin-right:10px;' + (cls === 'correct-ans' ? 'color:#16a34a;font-weight:600' : cls === 'your' ? 'color:#dc2626;text-decoration:line-through' : '') + '">'
                   + l + '. ' + escapeHtml(o) + '</span>';
        });
        optHtml += '</div>';
      }

      var title = w.title ? '<strong>' + escapeHtml(w.title) + '</strong><br>' : '';
      var correctCount = w.correctCount || 0;
      var correctBadge = correctCount > 0 ? '<span style="background:#dcfce7;padding:2px 8px;border-radius:10px;font-size:12px;color:#166534;margin-left:8px">答对 ' + correctCount + ' 次</span>' : '';
      
      return '<div class="wrong-item" onclick="showWrongBookDetail(\'' + w.id + '\')">'
        + '<div class="q-header">'
        + '<span class="error-count">错误 ' + (w.count || 1) + ' 次</span>'
        + correctBadge
        + '<span style="background:#eef2ff;padding:2px 8px;border-radius:10px;font-size:12px;color:#4f46e5;margin-left:8px">' + w.type + '</span>'
        + '<span style="float:right;color:#2d6a9f;font-size:13px;cursor:pointer">查看详情 ▶</span>'
        + '</div>'
        + '<div class="q-text">' + title + escapeHtml(w.question) + '</div>'
        + optHtml
        + '<div class="detail">你选了：<span class="your">' + escapeHtml(w.userAnswer || '未作答') + '</span>'
        + ' ｜ 正确答案：<span class="correct-ans">' + escapeHtml(w.answer) + '</span>'
        + ' ｜ <span style="color:#999;font-size:12px">最近错误：' + w.lastTime + '</span></div>'
        + '</div>';
    }).join('');
  }

  window.clearWrongBook = function() {
    if (!confirm('确定清空所有错题？')) return;
    wrongBook = [];
    saveWrongBook();
    renderWrongBook();
  };

  window.replayWrong = function() {
    if (wrongBook.length === 0) { alert('没有错题可重做'); return; }
    var pool = wrongBook.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    currentQuestions = pool.map(function(w) {
      var fullQ = window.题库.getQuestions(w.type).find(function(q) { return q.id === w.id; });
      return fullQ || w;
    });
    currentIndex = 0;
    currentAnswers = {};
    examMode = false;
    switchMode('practice');
    selectedType = '错题重做';
    $('practiceSettings').classList.add('hidden');
    $('practicePanel').classList.remove('hidden');
    renderPracticeQuestion();
  };

  function recordScore(type, correct) {
    if (!scoreData[type]) scoreData[type] = { done: 0, correct: 0 };
    scoreData[type].done++;
    if (correct === true) scoreData[type].correct++;
    localStorage.setItem('algoScoreData_v3', JSON.stringify(scoreData));
    
    totalStats.total = (totalStats.total || 0) + 1;
    if (correct === true) {
      totalStats.correct = (totalStats.correct || 0) + 1;
    } else {
      totalStats.wrong = (totalStats.wrong || 0) + 1;
    }
    saveTotalStats();
    updateStatsBar();
  }

  function updateNavStats() {
    $('wrongTabCount').textContent = wrongBook.length;
  }

  function renderKnowledgePoints(keyword) {
    var list = $('knowledgeList');
    var points = window.题库.searchKnowledgePoints(keyword || '');
    
    if (points.length === 0) {
      list.innerHTML = '<div class="knowledge-empty">📭 暂无相关知识点</div>';
      return;
    }
    
    list.innerHTML = points.map(function(p) {
      return '<div class="knowledge-card">'
           + '<div class="knowledge-header">'
           + '<span class="knowledge-title">' + escapeHtml(p.title) + '</span>'
           + '<span class="knowledge-category">' + escapeHtml(p.category) + '</span>'
           + '</div>'
           + '<div class="knowledge-content">' + formatKnowledgeContent(p.content) + '</div>'
           + '</div>';
    }).join('');
  }

  function formatKnowledgeContent(content) {
    if (!content) return '';
    content = escapeHtml(content);
    content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    content = content.replace(/`(.*?)`/g, '<code>$1</code>');
    return content;
  }

  window.handleSearch = function(event) {
    if (event.key === 'Enter') {
      performSearch();
    }
  };

  window.performSearch = function() {
    var keyword = $('searchInput').value.trim();
    if (keyword) {
      switchMode('knowledge');
      renderKnowledgePoints(keyword);
    }
  };

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  // ── 考前速记渲染函数 ──
  window.renderExamFocusPointsFromFile = function() {
    var list = document.getElementById('examFocusList');
    if (!list) return;
    var points = window.题库.getExamFocusPoints();
    if (!points || points.length === 0) {
      list.innerHTML = '<div class="knowledge-empty">📭 暂无考前速记内容</div>';
      return;
    }

    var html = '';
    var currentTag = '';
    points.forEach(function(p) {
      var tags = (p.tags || []).join(' ');
      if (tags) tags = '<span style="font-size:12px;color:#f59e0b;background:#fffbeb;padding:2px 8px;border-radius:8px;margin-left:8px">' + tags + '</span>';
      html += '<div class="knowledge-card" style="border-left-color:#f59e0b">'
           + '<div class="knowledge-header">'
           + '<span class="knowledge-title">' + escapeHtml(p.title) + '</span>'
           + tags
           + '</div>'
           + '<div class="knowledge-content">' + formatKnowledgeContent(p.content) + '</div>'
           + '</div>';
    });
    list.innerHTML = html;
  };

  // 覆盖原 renderExamFocusPoints
  window.renderExamFocusPoints = window.renderExamFocusPointsFromFile;

})();
</script>
</body>
</html>
